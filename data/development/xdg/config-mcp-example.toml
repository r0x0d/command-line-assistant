# Example configuration for using command-line-assistant with MCP support and ramalama
#
# This configuration demonstrates how to use:
# 1. Ramalama as the OpenAI-compatible inference server
# 2. MCP (Model Context Protocol) servers for tool calling
#
# To use this configuration:
# 1. Copy this file to ~/.config/command-line-assistant/config.toml
# 2. Start ramalama with a model that supports tool calling (e.g., llama3.2)
#    Example: ramalama serve --port 8080 llama3.2
# 3. Restart the clad daemon: systemctl --user restart clad

# History Database settings. By default, sqlite is used.
[database]
type = "sqlite"
connection_string = "/var/lib/command-line-assistant/history.db"

# History management configuration
[history]
enabled = true

# Backend settings for communicating with the inference server
[backend]
# Point to your ramalama server (or any OpenAI-compatible API)
endpoint = "http://localhost:8080"
# Use OpenAI-compatible mode for ramalama
mode = "openai"
# Specify the model name (must match the model you're serving)
model = "llama3.2"
# Increase timeout for local inference (CPU can be slow)
timeout = 120

# Configure authentication settings for backend
# Note: ramalama doesn't require authentication, so these are not used
[backend.auth]
cert_file = "/etc/pki/consumer/cert.pem"
key_file = "/etc/pki/consumer/key.pem"

# Logging configuration settings
[logging]
level = "INFO"

[logging.audit]
enabled = false

# MCP (Model Context Protocol) settings
[mcp]
# Enable MCP support to allow the LLM to use external tools
enabled = true

# Example: Filesystem MCP server
# Allows the LLM to read files from /tmp directory
[[mcp.servers]]
name = "filesystem"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

